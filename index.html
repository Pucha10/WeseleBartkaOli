<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleksandra i Bartłomiej - Logowanie</title>
    <!-- Czcionki Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="databaseScript.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <div id="login-container" class="login-wrapper">
        
        <div class="flower-decor top-flowers">
            <img src="img/kwiatki-gora.png" alt="dekoracja góra">
        </div>

        <div class="login-content">
            <div class="names-header">
                <h1 class="serif-name">ALEKSANDRA <span class="ampersand">&</span> BARTŁOMIEJ</h1>
            </div>

            <p class="login-instruction">
                Wpisz swoje imię, nazwisko oraz otrzymany na zaproszeniu kod PIN, aby zobaczyć szczegóły
            </p>

            <form id="login-form" class="classic-form">
                <div class="input-field">
                    <label for="firstname">IMIĘ</label>
                    <input type="text" id="firstname" required placeholder="">
                </div>
                <div class="input-field">
                    <label for="lastname">NAZWISKO</label>
                    <input type="text" id="lastname" required placeholder="">
                </div>
                <div class="input-field">
                    <label for="pin">KOD PIN</label>
                    <input type="password" id="pin" required placeholder="" maxlength="8">
                </div>
                
                <div class="button-wrapper">
                    <button type="submit" id="login-btn" class="pill-button">ZALOGUJ</button>
                </div>
                <p id="login-error" class="error-message"></p>
            </form>

            <div class="wedding-date-bottom">
                14.08.2027
            </div>
        </div>

        <!-- Dolna dekoracja (rozciągnięta na całą szerokość ekranu) -->
        <div class="flower-decor bottom-flowers">
            <img src="img/kwiatki-dol.png" alt="dekoracja dół">
        </div>
    </div>

    <!-- Główna zawartość strony po zalogowaniu -->
    <div id="main-container" class="main-site-wrapper hidden">
        <header class="main-header">
            <div class="logo-serif">A & B</div>
            <nav class="nav-links">
                <a href="#details">Szczegóły</a>
                <a href="#gallery">Zdjęcia</a>
                <button id="logout-btn" class="logout-btn-style">Wyloguj</button>
            </nav>
        </header>

        <main class="content-box">
            <section class="welcome-section">
                <h2 id="welcome-message" class="calligraphy-welcome">Witaj!</h2>
                <p id="admin-badge" class="badge hidden">Panel Administratora</p>
            </section>
        </main>
    </div>

</body>
</html>

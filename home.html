<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aleksandra i Bartłomiej - Strona Główna</title>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="databaseScript.js" defer></script>
    <script src="home.js" defer></script>
</head>
<body class="home-page">

    <div id="main-container" class="main-site-wrapper">
        
         <div class="names-header">
                <h1 class="serif-name">ALEKSANDRA <span class="ampersand">&</span> BARTŁOMIEJ</h1>
            </div>

        <div class="ornament-divider">
            <span class="divider-line"></span>
            <span class="divider-icon"><img src="img/flower.png" alt="dekoracja góra"></span>
            <span class="divider-line"></span>
        </div>


        <section class="countdown-section">
            <h2 class="countdown-title">DO ŚLUBU POZOSTAŁO</h2>
            <div class="countdown-card">
                <div class="time-box">
                    <span id="days" class="time-num">00</span>
                    <span class="time-label">DNI</span>
                </div>
                <div class="card-separator"></div>
                <div class="time-box">
                    <span id="hours" class="time-num">00</span>
                    <span class="time-label">GODZIN</span>
                </div>
                <div class="card-separator"></div>
                <div class="time-box">
                    <span id="minutes" class="time-num">00</span>
                    <span class="time-label">MINUT</span>
                </div>
                <div class="card-separator"></div>
                <div class="time-box">
                    <span id="seconds" class="time-num">00</span>
                    <span class="time-label">SEKUND</span>
                </div>
            </div>
        </section>

        <nav class="wedding-menu">

            <a href="lokalizacja.html" class="menu-item">
                <span class="menu-icon">📍</span>
                <span class="menu-text">LOKALIZACJA</span>
                <span class="menu-arrow">❯</span>
            </a>
            <a href="rsvp.html" class="menu-item">
                <span class="menu-icon">👥</span>
                <span class="menu-text">POTWIERDZENIE OBECNOŚCI</span>
                <span class="menu-arrow">❯</span>
            </a>
            <a href="galeria.html" class="menu-item">
                <span class="menu-icon">📷</span>
                <span class="menu-text">GALERIA</span>
                <span class="menu-arrow">❯</span>
            </a>
            <a href="kontakt.html" class="menu-item">
                <span class="menu-icon">✉️</span>
                <span class="menu-text">KONTAKT</span>
                <span class="menu-arrow">❯</span>
            </a>
        </nav>

        <div class="ornament-divider">
            <span class="divider-line"></span>
            <span class="divider-icon"><img src="img/heart-with-background.png" alt="serce"></span></span>
            <span class="divider-line"></span>
        </div>

        <footer class="home-footer">
            <p class="quote-text">"Najlepsze dopiero przed nami"</p>
            <a href="admin.html" id="admin-badge" class="badge hidden" style="text-decoration: none;">Panel Administratora</a>
            <button id="logout-btn" class="logout-btn-style-home">Wyloguj</button>
        </footer>

    </div>

</body>
</html>
